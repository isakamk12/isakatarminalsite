<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} - Stadio Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Bebas+Neue&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --static: #ff3b3b;
            --static-dim: rgba(255, 59, 59, .4);
            --overlay: rgba(4, 0, 0, .80);
            --text: #ffe8e8;
            --text-dim: #7a4a4a;
            --border: rgba(255, 59, 59, .25);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body,
        html {
            height: 100%;
            font-family: 'Noto Serif JP', 'Georgia', serif;
            background: #000;
            overflow: hidden;
        }

        .work-background {
            position: fixed;
            inset: 0;
            background-image:url('{{BG}}');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            filter: brightness(0.6) saturate(0.4) hue-rotate(320deg);
        }

        .glitch-overlay {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: repeating-linear-gradient(to bottom, transparent 0px, transparent 2px, rgba(255, 0, 0, .03) 2px, rgba(255, 0, 0, .03) 3px);
            animation: sFlick 6s step-end infinite;
        }

        @keyframes sFlick {

            0%,
            92%,
            94%,
            100% {
                opacity: 1;
            }

            93% {
                opacity: .6;
            }

            98% {
                opacity: .4;
            }
        }

        .main-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 640px;
            height: 90vh;
            margin: 5vh auto;
            background: var(--overlay);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 36px 40px 28px;
            animation: sApp 1s steps(3) both;
        }

        @keyframes sApp {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .warning-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px;
            background: rgba(255, 59, 59, .08);
            border: 1px solid var(--border);
            margin-bottom: 24px;
            flex-shrink: 0;
            opacity: 0;
            animation: wIn .6s .2s ease forwards;
        }

        .warning-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--static);
            animation: dBlink 1.5s ease-in-out infinite;
        }

        @keyframes dBlink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .15;
            }
        }

        .warning-text {
            font-size: .72rem;
            color: var(--static);
            letter-spacing: 3px;
        }

        @keyframes wIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .catch-copy {
            font-size: .88rem;
            color: var(--text-dim);
            letter-spacing: 2px;
            margin-bottom: 8px;
            opacity: 0;
            animation: stxt .5s .5s ease forwards;
        }

        .work-title {
            font-family: 'Bebas Neue', 'Noto Serif JP', sans-serif;
            font-size: 3.8rem;
            color: var(--text);
            line-height: 1.0;
            margin-bottom: 10px;
            letter-spacing: 3px;
            position: relative;
            opacity: 0;
            animation: stxt .5s .7s ease forwards;
        }

        .work-title::before,
        .work-title::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .work-title::before {
            color: rgba(255, 0, 100, .6);
            clip-path: polygon(0 30%, 100% 30%, 100% 50%, 0 50%);
            animation: g1 4s infinite;
        }

        .work-title::after {
            color: rgba(0, 200, 255, .4);
            clip-path: polygon(0 60%, 100% 60%, 100% 80%, 0 80%);
            animation: g2 5s infinite;
        }

        @keyframes g1 {

            0%,
            90%,
            93%,
            100% {
                transform: translateX(0);
                opacity: 0;
            }

            91% {
                transform: translateX(-4px);
                opacity: .8;
            }

            92% {
                transform: translateX(4px);
                opacity: .5;
            }
        }

        @keyframes g2 {

            0%,
            94%,
            96%,
            100% {
                transform: translateX(0);
                opacity: 0;
            }

            95% {
                transform: translateX(3px);
                opacity: .7;
            }
        }

        .meta-info {
            font-size: .8rem;
            color: var(--static);
            letter-spacing: 3px;
            margin-bottom: 22px;
            opacity: 0;
            animation: stxt .5s .9s ease forwards;
        }

        @keyframes stxt {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .synopsis-box {
            flex-grow: 1;
            font-size: 1rem;
            line-height: 1.9;
            color: var(--text);
            overflow-y: auto;
            margin-bottom: 20px;
            padding: 14px;
            white-space: pre-wrap;
            background: rgba(255, 59, 59, .03);
            border-left: 2px solid var(--border);
            opacity: 0;
            animation: stxt .7s 1.1s ease forwards;
        }

        .synopsis-box::-webkit-scrollbar {
            width: 3px;
        }

        .synopsis-box::-webkit-scrollbar-thumb {
            background: var(--static-dim);
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            opacity: 0;
            animation: stxt .6s 1.3s ease forwards;
        }

        .action-btn {
            background: transparent;
            color: var(--text);
            text-decoration: none;
            text-align: center;
            padding: 10px 8px;
            font-family: 'Noto Serif JP', serif;
            font-size: .82rem;
            border: 1px solid var(--border);
            letter-spacing: 1px;
            transition: background .2s, border-color .2s;
        }

        .action-btn:hover {
            background: rgba(255, 59, 59, .1);
            border-color: var(--static);
            color: var(--static);
        }

        .back-nav {
            position: fixed;
            bottom: 22px;
            right: 22px;
            z-index: 100;
            background: #000;
            color: var(--static);
            padding: 8px 16px;
            text-decoration: none;
            border: 1px solid var(--border);
            font-size: .8rem;
            letter-spacing: 2px;
            transition: background .2s;
        }

        .back-nav:hover {
            background: rgba(255, 59, 59, .1);
        }

        @media(max-width:600px) {
            .main-container {
                padding: 24px 20px 20px;
                height: 95vh;
                margin: 2.5vh auto;
            }

            .work-title {
                font-size: 2.6rem;
            }

            .button-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="work-background"></div>
    <div class="glitch-overlay"></div>
    <div class="main-container">
        <div class="warning-bar">
            <div class="warning-dot"></div><span class="warning-text">SIGNAL ACTIVE &#8212; UNSTABLE</span>
        </div>
        <p class="catch-copy">{{CATCH}}</p>
        <h1 class="work-title" data-text="{{TITLE}}">{{TITLE}}</h1>
        <p class="meta-info">{{META}}</p>
        <div class="synopsis-box">{{SYNOPSIS}}</div>
        <div class="button-grid">{{BUTTONS}}</div>
    </div>
    <a href="index.html" class="back-nav">&#8592; RETURN</a>
</body>

</html>
