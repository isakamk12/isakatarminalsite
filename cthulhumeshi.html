<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品詳細 - Stadio Vault</title>
    <style>
        /* === 1. 基本スタイル === */
        :root {
            --primary: #58a6ff;
            --overlay-bg: rgba(217, 217, 217, 0.85);
            --btn-red: #ff3333;
            --text-black: #000;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: "Courier New", "MS Gothic", monospace;
            background-color: #000;
            overflow: hidden;
        }

        /* === 2. 背景（未完成：不定形の闇、緑色の粘液、深淵の色彩をイメージ） === */
        .work-background {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #002211 0%, #000 100%);
            z-index: 1;
        }
        .work-background::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><path d="M10 10 Q 50 90 90 10" stroke="rgba(0,255,100,0.05)" fill="none" stroke-width="2"/></svg>');
            pointer-events: none;
        }

        /* === 3. コンテンツ外枠 === */
        .main-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 650px;
            height: 90vh;
            margin: 5vh auto;
            background: var(--overlay-bg);
            border: 4px solid #000;
            display: flex;
            flex-direction: column;
            padding: 40px;
            box-sizing: border-box;
            color: var(--text-black);
        }

        /* === 4. テキスト要素 === */
        .work-title {
            font-size: 4rem;
            font-weight: 900;
            margin: 10px 0 20px 0;
            line-height: 1.1;
        }

        .meta-info {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* あらすじ（レシピ）エリア */
        .synopsis-box {
            flex-grow: 1;
            font-size: 1.05rem;
            line-height: 1.6;
            font-weight: bold;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 10px;
            white-space: pre-wrap;
        }

        /* === 5. ボタン群 === */
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 10px;
        }

        .action-btn {
            background: var(--btn-red);
            color: #fff;
            text-decoration: none;
            text-align: center;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 25px;
            border: 3px solid #fff;
            box-shadow: 3px 3px 0px #000;
            transition: transform 0.1s;
        }
        .action-btn:hover { transform: scale(1.03); }

        .back-nav {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: #000;
            color: var(--primary);
            padding: 8px 15px;
            text-decoration: none;
            border: 1px solid var(--primary);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="work-background"></div>

    <div class="main-container">
        <h1 class="work-title">クトゥルフ飯</h1>

        <p class="meta-info">COOKING / Cosmic Horror Gourmet</p>

        <div class="synopsis-box">――本日のレシピ：ショゴスの香草バター焼き

【材料（4人分）】
・新鮮なショゴス …… 1体
・塩 …… 少々
・バター …… 20g
・正気度 …… お好みで

【下処理】
触手はよく水洗いし、名状しがたい部分を取り除きます。
粘液はキッチンペーパーで軽く押さえましょう。

【調理】
中火で両面をこんがり焼き、
宇宙的膨張が始まる前に素早く裏返します。

【ポイント】
焦ると現実が歪みます。落ち着いて。

――深淵は、意外と淡白。</div>

        <div class="button-grid">
            <a href="#" class="action-btn">準備中</a>
            <a href="#" class="action-btn">準備中</a>
            <a href="#" class="action-btn">準備中</a>
            <a href="#" class="action-btn">準備中</a>
        </div>
    </div>

    <a href="index.html" class="back-nav">RETURN TO TERMINAL</a>

</body>
</html>
