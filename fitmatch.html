<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品詳細 - Stadio Vault</title>
    <style>
        /* === 1. 基本スタイル === */
        :root {
            --primary: #58a6ff;
            --overlay-bg: rgba(217, 217, 217, 0.85);
            --btn-red: #ff3333;
            --text-black: #000;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: "Courier New", "MS Gothic", monospace;
            background-color: #000;
            overflow: hidden;
        }

        /* === 2. 背景（未完成：デジタルな脈動、ネオンブルーとマゼンタの残像をイメージ） === */
        .work-background {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #000 0%, #1a1a2a 100%);
            z-index: 1;
        }
        .work-background::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(transparent 0, transparent 2px, rgba(0, 255, 255, 0.03) 3px);
            pointer-events: none;
        }

        /* === 3. コンテンツ外枠 === */
        .main-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 650px;
            height: 90vh;
            margin: 5vh auto;
            background: var(--overlay-bg);
            border: 4px solid #000;
            display: flex;
            flex-direction: column;
            padding: 40px;
            box-sizing: border-box;
            color: var(--text-black);
        }

        /* === 4. テキスト要素 === */
        .catch-copy {
            font-size: 1.1rem;
            font-weight: bold;
            margin: 0;
            letter-spacing: 1px;
        }

        .work-title {
            font-size: 4rem;
            font-weight: 900;
            margin: 10px 0;
            line-height: 1.1;
            font-style: italic; /* 躍動感を演出 */
        }

        .meta-info {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* あらすじエリア */
        .synopsis-box {
            flex-grow: 1;
            font-size: 1.05rem;
            line-height: 1.7;
            font-weight: bold;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 10px;
            white-space: pre-wrap;
        }

        /* === 5. ボタン群 === */
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 10px;
        }

        .action-btn {
            background: var(--btn-red);
            color: #fff;
            text-decoration: none;
            text-align: center;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 25px;
            border: 3px solid #fff;
            box-shadow: 3px 3px 0px #000;
            transition: transform 0.1s;
        }
        .action-btn:hover { transform: scale(1.03); }
        .action-btn::after { content: " ▶"; font-size: 0.7rem; }

        .back-nav {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: #000;
            color: var(--primary);
            padding: 8px 15px;
            text-decoration: none;
            border: 1px solid var(--primary);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="work-background"></div>

    <div class="main-container">
        <p class="catch-copy">妄想の恋か、確実な現実か。</p>

        <h1 class="work-title">Fit Match</h1>

        <p class="meta-info">NOVEL / Sport & Dystopia Match</p>

        <div class="synopsis-box">運動データから導き出される、残酷なまでの適合性。
筋トレとマッチングアプリが融合したシステムは、瞬く間に社会を席巻した。

トレーニングによる多幸感、向上した体力、そして「デート」という名の安価な交流。
しかし光の裏で、身体のあらゆる要素は新たな差別の火種となった。

スペックが全てを決める世界。
その最底辺とされる「小柄な男女」が、軽い足取りでシステムの盲点を突き、実力を示していく。</div>

        <div class="button-grid">
            <a href="#" class="action-btn">準備中</a>
            <a href="#" class="action-btn">準備中</a>
            <a href="#" class="action-btn">準備中</a>
            <a href="#" class="action-btn">準備中</a>
        </div>
    </div>

    <a href="index.html" class="back-nav">RETURN TO TERMINAL</a>

</body>
</html>
