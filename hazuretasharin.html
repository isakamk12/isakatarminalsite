<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品詳細 - Stadio Vault</title>
    <style>
        :root {
            --primary: #58a6ff;
            --overlay-bg: rgba(217, 217, 217, 0.85);
            --btn-red: #ff3333;
            --text-black: #000;
        }
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: "Courier New", "MS Gothic", monospace;
            background-color: #000;
            overflow: hidden;
        }
        .work-background {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('image/hazuretasharin.png') no-repeat center center;
            background-size: cover;
            z-index: 1;
            filter: brightness(0.8);
        }
        .main-container {
            position: relative;
            z-index: 10;
            width: 90%; max-width: 650px; height: 90vh;
            margin: 5vh auto; background: var(--overlay-bg);
            border: 4px solid #000; display: flex; flex-direction: column;
            padding: 40px; box-sizing: border-box; color: var(--text-black);
        }
        .catch-copy { font-size: 1.1rem; font-weight: bold; margin: 0; letter-spacing: 1px; }
        .work-title { font-size: 3.8rem; font-weight: 900; margin: 10px 0; line-height: 1.1; }
        .meta-info { font-size: 1rem; font-weight: bold; margin-bottom: 20px; color: #d00; }
        .synopsis-box { flex-grow: 1; font-size: 1.05rem; line-height: 1.7; font-weight: bold; overflow-y: auto; margin-bottom: 20px; white-space: pre-wrap; }
        .button-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 10px; }
        .action-btn { background: var(--btn-red); color: #fff; text-decoration: none; text-align: center; padding: 12px; font-size: 0.9rem; font-weight: bold; border-radius: 25px; border: 3px solid #fff; box-shadow: 3px 3px 0px #000; transition: transform 0.1s; }
        .back-nav { position: fixed; bottom: 20px; right: 20px; z-index: 100; background: #000; color: var(--primary); padding: 8px 15px; text-decoration: none; border: 1px solid var(--primary); font-weight: bold; }
    </style>
</head>
<body>
    <div class="work-background"></div>
    <div class="main-container">
        <p class="catch-copy">社会のレールから弾き飛ばされた、その後の歩み。</p>
        <h1 class="work-title">外れた車輪</h1>
        <p class="meta-info">NON-FICTION / Documentary Aftermath</p>
        <div class="synopsis-box">『死屍涙々』の後日譚。
最愛の瀬奈を失い、社会という巨大な機構のレールから弾き飛ばされた基徒 花十。

古本屋で出会った物部静との奇妙な交流。そして、母パトリシアを襲った過酷な受難（詐欺被害）。
次々と押し寄せる理不尽な現実を、彼は「当然の報い」として受け入れようと足掻く。

壊れた車輪のまま、どこへ向かうこともできず彷徨う魂の遍歴。</div>
        <div class="button-grid">
            <a href="#" class="action-btn">準備中</a><a href="#" class="action-btn">準備中</a>
        </div>
    </div>
    <a href="index.html" class="back-nav">RETURN TO TERMINAL</a>
</body>
</html>
