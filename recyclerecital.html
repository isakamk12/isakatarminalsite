<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品詳細 - Stadio Vault</title>
    <style>
        /* デザイン・スタイルは一貫性を維持 */
        :root {
            --primary: #58a6ff;
            --overlay-bg: rgba(217, 217, 217, 0.85);
            --btn-red: #ff3333;
            --text-black: #000;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: "Courier New", "MS Gothic", monospace;
            background-color: #000;
            overflow: hidden;
        }

        .work-background {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #121212 0%, #1a1a2e 100%);
            z-index: 1;
        }

        .main-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 650px;
            height: 90vh;
            margin: 5vh auto;
            background: var(--overlay-bg);
            border: 4px solid #000;
            display: flex;
            flex-direction: column;
            padding: 40px;
            box-sizing: border-box;
            color: var(--text-black);
        }

        .catch-copy {
            font-size: 1.1rem;
            font-weight: bold;
            margin: 0;
            letter-spacing: 1px;
        }

        .work-title {
            font-size: 3.2rem;
            font-weight: 900;
            margin: 10px 0;
            line-height: 1.1;
        }

        .meta-info {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .synopsis-box {
            flex-grow: 1;
            font-size: 1.05rem;
            line-height: 1.7;
