<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>死屍涙々 - Stadio Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* ===== THEME: NONFICTION-GRAVE ===== */
        /* ノンフィクション / ドキュメンタリー → 禁欲的・白紙的・重厚 */
        :root {
            --white: #f0f0ec;
            --grey: #9a9a9a;
            --dark: #0c0c0c;
            --red-dim: #8a1a1a;
            --overlay: rgba(8, 8, 8, 0.82);
            --border: rgba(200, 200, 200, 0.2);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body,
        html {
            height: 100%;
            font-family: 'Noto Serif JP', 'Georgia', serif;
            background: #000;
            overflow: hidden;
        }

        /* === 背景（表紙）=== */
        .work-background {
            position: fixed;
            inset: 0;
            background: url('image/shishiruiru.png') no-repeat center center / cover;
            z-index: 1;
            filter: brightness(0.5) grayscale(0.7);
            animation: bgStill 15s ease-in-out infinite alternate;
        }

        @keyframes bgStill {
            from {
                transform: scale(1.0);
            }

            to {
                transform: scale(1.02);
            }
        }

        /* === メインコンテナ === */
        .main-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 620px;
            height: 90vh;
            margin: 5vh auto;
            background: var(--overlay);
            border-left: 3px solid var(--border);
            border-right: 3px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 50px 40px 30px;
            animation: graveFadeIn 1.4s ease both;
        }

        @keyframes graveFadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* 上部：細いグレー線 */
        .header-line {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
            flex-shrink: 0;
            opacity: 0;
            animation: lineSlide 0.8s 0.2s ease forwards;
        }

        .header-line::before,
        .header-line::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .header-label {
            font-size: 0.7rem;
            color: var(--grey);
            letter-spacing: 4px;
            white-space: nowrap;
        }

        @keyframes lineSlide {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .catch-copy {
            font-size: 0.88rem;
            font-style: italic;
            color: var(--grey);
            letter-spacing: 1px;
            margin-bottom: 10px;
            opacity: 0;
            animation: itemFadeIn 0.6s 0.5s ease forwards;
        }

        .work-title {
            font-size: 4rem;
            font-weight: 900;
            color: var(--white);
            line-height: 1.0;
            margin-bottom: 12px;
            letter-spacing: -2px;
            opacity: 0;
            animation: itemFadeIn 0.6s 0.7s ease forwards;
        }

        .meta-info {
            font-size: 0.78rem;
            color: var(--red-dim);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 28px;
            opacity: 0;
            animation: itemFadeIn 0.6s 0.9s ease forwards;
        }

        @keyframes itemFadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 区切り線（ドキュメント感） */
        .divider {
            height: 1px;
            background: var(--border);
            margin-bottom: 22px;
            flex-shrink: 0;
            opacity: 0;
            animation: itemFadeIn 0.5s 1s ease forwards;
        }

        /* あらすじ */
        .synopsis-box {
            flex-grow: 1;
            font-size: 1.0rem;
            line-height: 2.1;
            color: rgba(240, 240, 236, 0.85);
            overflow-y: auto;
            margin-bottom: 22px;
            padding-right: 8px;
            white-space: pre-wrap;
            opacity: 0;
            animation: itemFadeIn 0.8s 1.1s ease forwards;
        }

        .synopsis-box::-webkit-scrollbar {
            width: 2px;
        }

        .synopsis-box::-webkit-scrollbar-thumb {
            background: var(--border);
        }

        /* === ボタン群 === */
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            opacity: 0;
            animation: itemFadeIn 0.6s 1.3s ease forwards;
        }

        .action-btn {
            background: transparent;
            color: var(--white);
            text-decoration: none;
            text-align: center;
            padding: 11px 8px;
            font-family: 'Noto Serif JP', serif;
            font-size: 0.82rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
            transition: border-color 0.25s, color 0.25s;
        }

        .action-btn:hover {
            border-color: var(--white);
            color: var(--white);
            background: rgba(255, 255, 255, 0.05);
        }

        /* 戻るボタン */
        .back-nav {
            position: fixed;
            bottom: 22px;
            right: 22px;
            z-index: 100;
            background: var(--dark);
            color: var(--grey);
            padding: 8px 16px;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-family: 'Noto Serif JP', serif;
            font-size: 0.8rem;
            letter-spacing: 2px;
            transition: color 0.2s, border-color 0.2s;
        }

        .back-nav:hover {
            color: var(--white);
            border-color: rgba(255, 255, 255, 0.5);
        }

        @media (max-width: 600px) {
            .main-container {
                padding: 30px 20px 20px;
                height: 95vh;
                margin: 2.5vh auto;
            }

            .work-title {
                font-size: 2.8rem;
            }

            .button-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="work-background"></div>

    <div class="main-container">
        <div class="header-line">
            <span class="header-label">NON-FICTION / DOCUMENTARY</span>
        </div>

        <p class="catch-copy">「風が立ったとしても、君は死んでくれるなよ。」</p>

        <h1 class="work-title">死屍涙々</h1>

        <p class="meta-info">Real Story &ensp;·&ensp; 閲覧注意</p>

        <div class="divider"></div>

        <div class="synopsis-box">基徒花十と、病室で過ごす瀬奈の凄絶な記録。

            愛する人が「中途覚醒時健忘」によって、少しずつ、だが確実に自分を忘れていく。
            そして訪れる、回避不能な死。

            過酷な現実を前に、残された者は自身の精神的欠落、資本主義社会の歪み、宗教的背景を見つめることになる。
            これは、死にゆく者を見届け、自らの生の意義を問い直した痛切なる独白である。</div>

        <div class="button-grid">
            <a href="#" class="action-btn">準備中</a>
            <a href="#" class="action-btn">準備中</a>
        </div>
    </div>

    <a href="index.html" class="back-nav">← 一覧へ戻る</a>

</body>

</html>
