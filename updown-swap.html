<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品詳細 - Stadio Vault</title>
    <style>
        /* === 1. 基本スタイル === */
        :root {
            --primary: #58a6ff;
            --overlay-bg: rgba(217, 217, 217, 0.85);
            --btn-red: #ff3333;
            --text-black: #000;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: "Courier New", "MS Gothic", monospace;
            background-color: #000;
            overflow: hidden;
        }

        /* === 2. 背景（未完成：魂の入れ替わりや、器の傷をイメージした抽象的な暗色） === */
        .work-background {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(225deg, #000 0%, #1a0a2a 50%, #000 100%);
            z-index: 1;
        }
        .work-background::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-radial-gradient(circle, transparent, transparent 20px, rgba(255,255,255,0.02) 21px);
            pointer-events: none;
        }

        /* === 3. コンテンツ外枠 === */
        .main-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 650px;
            height: 90vh;
            margin: 5vh auto;
            background: var(--overlay-bg);
            border: 4px solid #000;
            display: flex;
            flex-direction: column;
            padding: 40px;
            box-sizing: border-box;
            color: var(--text-black);
        }

        /* === 4. テキスト要素 === */
        .catch-copy {
            font-size: 1.1rem;
            font-weight: bold;
            margin: 0;
            letter-spacing: 1px;
        }

        .work-title {
            font-size: 3.5rem;
            font-weight: 900;
            margin: 10px 0;
            line-height: 1.1;
        }

        .meta-info {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* あらすじエリア */
        .synopsis-box {
            flex-grow: 1;
            font-size: 1.05rem;
            line-height: 1.7;
            font-weight: bold;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 10px;
            white-space: pre-wrap;
        }

        /* === 5. ボタン群 === */
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 10px;
        }

        .action-btn {
            background: var(--btn-red);
            color: #fff;
            text-decoration: none;
            text-align: center;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 25px;
            border: 3px solid #fff;
            box-shadow: 3px 3px 0px #000;
            transition: transform 0.1s;
        }
        .action-btn:hover { transform: scale(1.03); }
        .action-btn::after { content: " ▶"; font-size: 0.7rem; }

        .back-nav {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: #000;
            color: var(--primary);
            padding: 8px 15px;
            text-decoration: none;
            border: 1px solid var(--primary);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="work-background"></div>

    <div class="main-container">
        <p class="catch-copy">希望の為に努力するのか、希望を探す努力をするのか。</p>

        <h1 class="work-title">UPDOWN SWAP</h1>

        <p class="meta-info">NOVEL / Negative Face Part 2</p>

        <div class="synopsis-box">魂が定期的に入れ替わる世界。
人々は入れ替わりによる緩急を受け入れ、案外平穏に過ごしていた。

しかし、その秩序は崩れ始める。
「世界一美しい器」が年々傷を負い、ついには自殺へと至る事件が発生。
入れ替わりの法則性を逆手に取った抹殺計画が静かに動き出す。

ネガティブ・フェイス第二部。
器と魂の境界線で、揺らぎ始めた世界の真実を問う。</div>

        <div class="button-grid">
            <a href="#" class="action-btn">準備中</a>
            <a href="#" class="action-btn">準備中</a>
            <a href="#" class="action-btn">準備中</a>
            <a href="#" class="action-btn">準備中</a>
        </div>
    </div>

    <a href="index.html" class="back-nav">RETURN TO TERMINAL</a>

</body>
</html>
