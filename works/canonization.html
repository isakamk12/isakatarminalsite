<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>列聖 - Stadio Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Cinzel:wght@400;700;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --gold: #d4a84b;
            --gold-light: #f0cc78;
            --gold-dim: rgba(212, 168, 75, .3);
            --navy: #08101e;
            --overlay: rgba(6, 12, 26, .80);
            --text: #ede8d8;
            --border: rgba(212, 168, 75, .4);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body,
        html {
            height: 100%;
            font-family: 'Noto Serif JP', 'Georgia', serif;
            background: var(--navy);
            overflow: hidden;
        }

        .work-background {
            position: fixed;
            inset: 0;
            background-image:url('../image/canonization.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            filter: brightness(0.65) sepia(0.3);
            animation: mPan 20s ease-in-out infinite alternate;
        }

        @keyframes mPan {
            from {
                transform: scale(1.05) translateX(10px);
            }

            to {
                transform: scale(1.0) translateX(-10px);
            }
        }

        .vignette {
            position: fixed;
            inset: 0;
            z-index: 2;
            background: radial-gradient(ellipse at top, rgba(212, 168, 75, .08) 0%, transparent 60%), radial-gradient(ellipse at bottom, rgba(0, 0, 0, .6) 0%, transparent 60%);
            pointer-events: none;
        }

        .main-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 640px;
            height: 90vh;
            margin: 5vh auto;
            background: var(--overlay);
            border: 1px solid var(--border);
            box-shadow: inset 0 0 0 4px rgba(212, 168, 75, .06), 0 0 60px rgba(0, 0, 0, .6);
            display: flex;
            flex-direction: column;
            padding: 36px 44px 28px;
            animation: eOpen 1.2s cubic-bezier(.2, 1, .3, 1) both;
        }

        @keyframes eOpen {
            from {
                opacity: 0;
                clip-path: inset(30% 0 30% 0);
            }

            to {
                opacity: 1;
                clip-path: inset(0% 0 0% 0);
            }
        }

        .main-container::before,
        .main-container::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: var(--gold);
            border-style: solid;
        }

        .main-container::before {
            top: 10px;
            left: 10px;
            border-width: 2px 0 0 2px;
        }

        .main-container::after {
            bottom: 10px;
            right: 10px;
            border-width: 0 2px 2px 0;
        }

        .gold-rule {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            flex-shrink: 0;
            opacity: 0;
            animation: gRise .8s .2s ease forwards;
        }

        .gold-rule::before,
        .gold-rule::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .gold-rule-icon {
            color: var(--gold);
            font-size: 1rem;
        }

        @keyframes gRise {
            from {
                opacity: 0;
                transform: scaleX(0);
            }

            to {
                opacity: 1;
                transform: scaleX(1);
            }
        }

        .catch-copy {
            font-size: .88rem;
            font-style: italic;
            color: var(--gold);
            letter-spacing: 2px;
            margin-bottom: 8px;
            opacity: 0;
            animation: eTxt .7s .5s ease forwards;
        }

        .work-title {
            font-family: 'Cinzel', 'Noto Serif JP', serif;
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--gold-light);
            line-height: 1.15;
            margin-bottom: 10px;
            text-shadow: 0 2px 20px rgba(212, 168, 75, .3);
            opacity: 0;
            animation: eTxt .7s .7s ease forwards;
        }

        .meta-info {
            font-size: .8rem;
            color: rgba(212, 168, 75, .7);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 22px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--gold-dim);
            opacity: 0;
            animation: eTxt .6s .9s ease forwards;
        }

        @keyframes eTxt {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .synopsis-box {
            flex-grow: 1;
            font-size: 1rem;
            line-height: 2.0;
            color: var(--text);
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 8px;
            white-space: pre-wrap;
            opacity: 0;
            animation: eTxt .8s 1.1s ease forwards;
        }

        .synopsis-box::-webkit-scrollbar {
            width: 3px;
        }

        .synopsis-box::-webkit-scrollbar-thumb {
            background: var(--gold-dim);
        }

        .gold-rule-bottom {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
            margin-bottom: 16px;
            flex-shrink: 0;
            opacity: 0;
            animation: eTxt .5s 1.2s ease forwards;
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            opacity: 0;
            animation: eTxt .6s 1.3s ease forwards;
        }

        .action-btn {
            background: transparent;
            color: var(--gold);
            text-decoration: none;
            text-align: center;
            padding: 10px 8px;
            font-family: 'Noto Serif JP', serif;
            font-size: .82rem;
            border: 1px solid var(--border);
            letter-spacing: 1px;
            transition: background .3s, box-shadow .3s;
        }

        .action-btn:hover {
            background: rgba(212, 168, 75, .1);
            box-shadow: inset 0 0 10px rgba(212, 168, 75, .1);
            color: var(--gold-light);
        }

        .back-nav {
            position: fixed;
            bottom: 22px;
            right: 22px;
            z-index: 100;
            background: rgba(6, 12, 26, .95);
            color: var(--gold);
            padding: 8px 16px;
            text-decoration: none;
            border: 1px solid var(--border);
            font-family: 'Noto Serif JP', serif;
            font-size: .8rem;
            letter-spacing: 2px;
            transition: background .25s;
        }

        .back-nav:hover {
            background: rgba(212, 168, 75, .1);
        }

        @media(max-width:600px) {
            .main-container {
                padding: 28px 20px 20px;
                height: 95vh;
                margin: 2.5vh auto;
            }

            .work-title {
                font-size: 2rem;
            }

            .button-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
<link rel="stylesheet" href="../mouse-trail.css">
</head>

<body>
    <div class="work-background"></div>
    <div class="vignette"></div>
    <div class="main-container">
        <div class="gold-rule"><span class="gold-rule-icon">&#10022;</span></div>
        <p class="catch-copy">ここにキャッチコピーを挿入（例：煤けた神父と、鉄を喰らう少年）</p>
        <h1 class="work-title">列聖</h1>
        <p class="meta-info">NOVEL / 連載中</p>
        <div class="synopsis-box">煤けた神父、鉄を喰らう傭兵の少年、そして「救世主」の少女。

三人が歩むのは、祈りの届かない泥と殺意の回廊。

少女の清廉な理想は、少年の振るう無慈悲な暴力によって無惨に守られ、やがて彼女の思想は冷たく凝固していく。

奇跡を他者に譲り、自ら汚れを受け入れた少女が辿り着くのは、聖なる列福か、それとも。</div>
        <div class="gold-rule-bottom"></div>
        <div class="button-grid"><a href="https://www.alphapolis.co.jp/novel/568634872/739019163/episode/10599106" class="action-btn" target="_blank">アルファポリス</a>
            <a href="https://ncode.syosetu.com/n7393ln/" class="action-btn" target="_blank">小説家になろう</a>
            <a href="https://kakuyomu.jp/my/works/822139841830756398/episodes/822139841830848461" class="action-btn" target="_blank">カクヨム</a>
            <a href="https://note.com/isakaakasi/n/n5d3fd1345b8c" class="action-btn" target="_blank">note</a></div>
    </div>

<script src="../mouse-trail.js"></script>
</body>

</html>
