<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOOMSDAY SYNDROMES - Stadio Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Bebas+Neue&display=swap"
        rel="stylesheet">
    <style>
        /* ===== THEME: HORROR-STATIC ===== */
        /* 超能力 / SF-ホラー / ゲームシナリオ → ノイズ・電波・滲みグリッチ */
        :root {
            --static: #ff3b3b;
            --static-dim: rgba(255, 59, 59, 0.4);
            --overlay: rgba(4, 0, 0, 0.80);
            --text: #ffe8e8;
            --text-dim: #7a4a4a;
            --border: rgba(255, 59, 59, 0.25);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body,
        html {
            height: 100%;
            font-family: 'Noto Serif JP', 'Georgia', serif;
            background: #000;
            overflow: hidden;
        }

        /* === 背景（表紙）=== */
        .work-background {
            position: fixed;
            inset: 0;
            background: url('../image/doomsday-syndromes.png') no-repeat center center / cover;
            z-index: 1;
            filter: brightness(0.6) saturate(0.4) hue-rotate(320deg);
        }

        /* グリッチ演出（ランダムなズレ） */
        .glitch-overlay {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background:
                repeating-linear-gradient(to bottom,
                    transparent 0px,
                    transparent 2px,
                    rgba(255, 0, 0, 0.03) 2px,
                    rgba(255, 0, 0, 0.03) 3px);
            animation: staticFlicker 6s step-end infinite;
        }

        @keyframes staticFlicker {
            0% {
                opacity: 1;
            }

            92% {
                opacity: 1;
            }

            93% {
                opacity: 0.6;
            }

            94% {
                opacity: 1;
            }

            97% {
                opacity: 1;
            }

            98% {
                opacity: 0.4;
            }

            100% {
                opacity: 1;
            }
        }

        /* === メインコンテナ === */
        .main-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 640px;
            height: 90vh;
            margin: 5vh auto;
            background: var(--overlay);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 36px 40px 28px;
            animation: staticAppear 1.0s steps(3) both;
        }

        @keyframes staticAppear {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* 上部警告ライン */
        .warning-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px;
            background: rgba(255, 59, 59, 0.08);
            border: 1px solid var(--border);
            margin-bottom: 24px;
            flex-shrink: 0;
            opacity: 0;
            animation: warningIn 0.6s 0.2s ease forwards;
        }

        .warning-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--static);
            animation: dotBlink 1.5s ease-in-out infinite;
        }

        @keyframes dotBlink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.15;
            }
        }

        .warning-text {
            font-size: 0.72rem;
            color: var(--static);
            letter-spacing: 3px;
            font-family: 'Noto Serif JP', monospace;
        }

        @keyframes warningIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .catch-copy {
            font-size: 0.88rem;
            color: var(--text-dim);
            letter-spacing: 2px;
            margin-bottom: 8px;
            opacity: 0;
            animation: staticText 0.5s 0.5s ease forwards;
        }

        /* グリッチタイトルエフェクト */
        .work-title {
            font-family: 'Bebas Neue', 'Noto Serif JP', sans-serif;
            font-size: 3.8rem;
            font-weight: 400;
            color: var(--text);
            line-height: 1.0;
            margin-bottom: 10px;
            letter-spacing: 3px;
            position: relative;
            opacity: 0;
            animation: staticText 0.5s 0.7s ease forwards;
        }

        /* タイトルのグリッチ残像 */
        .work-title::before,
        .work-title::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .work-title::before {
            color: rgba(255, 0, 100, 0.6);
            clip-path: polygon(0 30%, 100% 30%, 100% 50%, 0 50%);
            animation: glitch1 4s infinite;
        }

        .work-title::after {
            color: rgba(0, 200, 255, 0.4);
            clip-path: polygon(0 60%, 100% 60%, 100% 80%, 0 80%);
            animation: glitch2 5s infinite;
        }

        @keyframes glitch1 {

            0%,
            90% {
                transform: translateX(0);
                opacity: 0;
            }

            91% {
                transform: translateX(-4px);
                opacity: 0.8;
            }

            92% {
                transform: translateX(4px);
                opacity: 0.5;
            }

            93%,
            100% {
                transform: translateX(0);
                opacity: 0;
            }
        }

        @keyframes glitch2 {

            0%,
            94% {
                transform: translateX(0);
                opacity: 0;
            }

            95% {
                transform: translateX(3px);
                opacity: 0.7;
            }

            96%,
            100% {
                transform: translateX(0);
                opacity: 0;
            }
        }

        .meta-info {
            font-size: 0.8rem;
            color: var(--static);
            letter-spacing: 3px;
            margin-bottom: 22px;
            opacity: 0;
            animation: staticText 0.5s 0.9s ease forwards;
        }

        @keyframes staticText {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* あらすじ */
        .synopsis-box {
            flex-grow: 1;
            font-size: 1.0rem;
            line-height: 1.9;
            color: var(--text);
            overflow-y: auto;
            margin-bottom: 20px;
            padding: 14px;
            white-space: pre-wrap;
            background: rgba(255, 59, 59, 0.03);
            border-left: 2px solid var(--border);
            opacity: 0;
            animation: staticText 0.7s 1.1s ease forwards;
        }

        .synopsis-box::-webkit-scrollbar {
            width: 3px;
        }

        .synopsis-box::-webkit-scrollbar-thumb {
            background: var(--static-dim);
        }

        /* === ボタン群 === */
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            opacity: 0;
            animation: staticText 0.6s 1.3s ease forwards;
        }

        .action-btn {
            background: transparent;
            color: var(--text);
            text-decoration: none;
            text-align: center;
            padding: 10px 8px;
            font-family: 'Noto Serif JP', serif;
            font-size: 0.82rem;
            border: 1px solid var(--border);
            letter-spacing: 1px;
            transition: background 0.2s, border-color 0.2s;
        }

        .action-btn.special-btn {
            border-color: var(--static);
            color: var(--static);
            background: rgba(255, 59, 59, 0.05);
            font-weight: bold;
        }

        .action-btn:hover {
            background: rgba(255, 59, 59, 0.1);
            border-color: var(--static);
            color: var(--static);
        }

        /* 戻るボタン */
        .back-nav {
            position: fixed;
            bottom: 22px;
            right: 22px;
            z-index: 100;
            background: #000;
            color: var(--static);
            padding: 8px 16px;
            text-decoration: none;
            border: 1px solid var(--border);
            font-size: 0.8rem;
            letter-spacing: 2px;
            transition: background 0.2s;
        }

        .back-nav:hover {
            background: rgba(255, 59, 59, 0.1);
        }

        @media (max-width: 600px) {
            .main-container {
                padding: 24px 20px 20px;
                height: 95vh;
                margin: 2.5vh auto;
            }

            .work-title {
                font-size: 2.6rem;
            }

            .button-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="work-background"></div>
    <div class="glitch-overlay"></div>

    <div class="main-container">
        <div class="warning-bar">
            <div class="warning-dot"></div>
            <span class="warning-text">TRANSMISSION ACTIVE — SIGNAL UNSTABLE</span>
        </div>

        <p class="catch-copy">遺伝と、命と、死と、社会</p>

        <h1 class="work-title" data-text="ドゥームズデイ·シンドローム">ドゥームズデイ·シンドローム</h1>

        <p class="meta-info">NOVEL · 連載中</p>

        <div class="synopsis-box">魔女裁判の流行は超能力者を極東に逃亡させるという結果になり、超能力は爆発的に増え、報復が始まろうとしていた…

            それはいかんと超能力課の捜査官は立ち上がり、極東へ赴く。</div>

        <div class="button-grid">
            <a href="doomsday-syndromes-special.html" class="action-btn special-btn">コンセプトページ(特別版)</a>
            <a href="https://www.alphapolis.co.jp/novel/568634872/759976345/episode/9873205" class="action-btn"
                target="_blank">アルファポリス</a>
            <a href="https://syosetu.com/usernoveldatamanage/top/ncode/2577293/noveldataid/26404583/" class="action-btn"
                target="_blank">小説家になろう</a>
            <a href="https://kakuyomu.jp/my/works/822139838497127362/episodes/822139838497186835" class="action-btn"
                target="_blank">カクヨム</a>
        </div>
    </div>

    <a href="../index.html" class="back-nav">← RETURN</a>

</body>

</html>
