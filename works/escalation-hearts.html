<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>エスカレーション・ハート - Stadio Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --rose: #e8a4b0;
            --cream: #fdf6f0;
            --light-bg: rgba(20, 8, 12, .68);
            --border: rgba(232, 164, 176, .35);
            --text: #fdf0f3;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body,
        html {
            height: 100%;
            font-family: 'Noto Serif JP', 'Georgia', serif;
            background: #120810;
            overflow: hidden;
        }

        .work-background {
            position: fixed;
            inset: 0;
            background-image:url('../image/escalation-hearts.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            filter: brightness(0.7);
            animation: psDrift 14s ease-in-out infinite alternate;
        }

        @keyframes psDrift {
            from {
                transform: scale(1.0) translateY(0);
            }

            to {
                transform: scale(1.04) translateY(-8px);
            }
        }

        .petals-container {
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            top: -20px;
            width: 8px;
            height: 8px;
            border-radius: 50% 0;
            background: rgba(232, 164, 176, .5);
            animation: pFall linear infinite;
        }

        .petal:nth-child(1) {
            left: 10%;
            animation-duration: 8s;
            animation-delay: 0s;
            width: 6px;
            height: 6px;
        }

        .petal:nth-child(2) {
            left: 25%;
            animation-duration: 11s;
            animation-delay: 2s;
            width: 10px;
            height: 10px;
        }

        .petal:nth-child(3) {
            left: 40%;
            animation-duration: 9s;
            animation-delay: 4s;
            opacity: .6;
        }

        .petal:nth-child(4) {
            left: 60%;
            animation-duration: 13s;
            animation-delay: 1s;
            width: 5px;
            height: 5px;
        }

        .petal:nth-child(5) {
            left: 78%;
            animation-duration: 10s;
            animation-delay: 3s;
            opacity: .5;
        }

        .petal:nth-child(6) {
            left: 90%;
            animation-duration: 7s;
            animation-delay: 5s;
            width: 7px;
            height: 7px;
        }

        @keyframes pFall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: .8;
            }

            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }

        .main-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 620px;
            height: 90vh;
            margin: 5vh auto;
            background: var(--light-bg);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 36px 44px 28px;
            backdrop-filter: blur(4px);
            animation: psOpen 1.0s cubic-bezier(.22, 1, .36, 1) both;
        }

        @keyframes psOpen {
            from {
                opacity: 0;
                transform: scale(.97);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .flower-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-shrink: 0;
            opacity: 0;
            animation: rIn .7s .2s ease forwards;
        }

        .flower-deco {
            color: var(--rose);
            font-size: 1rem;
            letter-spacing: 4px;
        }

        .flower-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--border), transparent);
        }

        @keyframes rIn {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .catch-copy {
            font-size: .9rem;
            font-style: italic;
            color: var(--rose);
            letter-spacing: 1px;
            margin-bottom: 8px;
            opacity: 0;
            animation: rIn .6s .4s ease forwards;
        }

        .work-title {
            font-size: 3rem;
            font-weight: 900;
            color: var(--cream);
            line-height: 1.1;
            margin-bottom: 10px;
            text-shadow: 0 2px 15px rgba(232, 164, 176, .3);
            opacity: 0;
            animation: rIn .7s .6s ease forwards;
        }

        .meta-info {
            font-size: .8rem;
            color: var(--rose);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 22px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            opacity: 0;
            animation: rIn .6s .8s ease forwards;
        }

        .synopsis-box {
            flex-grow: 1;
            font-size: 1rem;
            line-height: 2.1;
            color: var(--text);
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 8px;
            white-space: pre-wrap;
            opacity: 0;
            animation: rIn .8s 1s ease forwards;
        }

        .synopsis-box::-webkit-scrollbar {
            width: 3px;
        }

        .synopsis-box::-webkit-scrollbar-thumb {
            background: var(--border);
        }

        .flower-footer {
            text-align: center;
            color: rgba(232, 164, 176, .4);
            letter-spacing: 6px;
            font-size: .85rem;
            margin-bottom: 16px;
            flex-shrink: 0;
            opacity: 0;
            animation: rIn .5s 1.1s ease forwards;
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            opacity: 0;
            animation: rIn .6s 1.2s ease forwards;
        }

        .action-btn {
            background: transparent;
            color: var(--rose);
            text-decoration: none;
            text-align: center;
            padding: 10px 8px;
            font-family: 'Noto Serif JP', serif;
            font-size: .82rem;
            border: 1px solid var(--border);
            letter-spacing: 1px;
            transition: background .3s, color .3s;
        }

        .action-btn:hover {
            background: rgba(232, 164, 176, .12);
            color: var(--cream);
            border-color: var(--rose);
        }

        .back-nav {
            position: fixed;
            bottom: 22px;
            right: 22px;
            z-index: 100;
            background: rgba(20, 8, 12, .95);
            color: var(--rose);
            padding: 8px 16px;
            text-decoration: none;
            border: 1px solid var(--border);
            font-family: 'Noto Serif JP', serif;
            font-size: .8rem;
            letter-spacing: 2px;
            transition: background .25s;
        }

        .back-nav:hover {
            background: rgba(232, 164, 176, .1);
        }

        @media(max-width:600px) {
            .main-container {
                padding: 24px 20px 20px;
                height: 95vh;
                margin: 2.5vh auto;
            }

            .work-title {
                font-size: 2.1rem;
            }

            .button-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
<link rel="stylesheet" href="../mouse-trail.css">
</head>

<body>
    <div class="work-background"></div>
    <div class="petals-container">
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
    </div>
    <div class="main-container">
        <div class="flower-header"><span class="flower-deco">&#10047; &#10047;</span>
            <div class="flower-line"></div>
        </div>
        <p class="catch-copy">このタイトルの癖に題材エレベーターなんですけどどうなんすか</p>
        <h1 class="work-title">エスカレーション・ハート</h1>
        <p class="meta-info">NOVEL / 連載中</p>
        <div class="synopsis-box">エレベーターが苦手な彼女は、 雨の日の密室で、びしょ濡れの無言の男と二人きりになる。

上昇しない箱。 閉まりかける扉。 押し続ける「開」のボタン。 水滴の音。 沈黙。

恐怖と緊張のはずなのに、 なぜかその指を、離せなくなる。
そして、男が取ったひとつの小さな行動が、 恐怖…</div>
        <div class="flower-footer">&#10022;</div>

            <a href="https://note.com/isakaakasi/n/ne86ec9b8e4f7" class="action-btn" target="_blank">note</a></div>
    </div>

<script src="../mouse-trail.js"></script>
</body>

</html>
