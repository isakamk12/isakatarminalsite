<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>外れた車輪 - Stadio Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --white: #f0f0ec;
            --grey: #9a9a9a;
            --dark: #0c0c0c;
            --red-dim: #8a1a1a;
            --overlay: rgba(8, 8, 8, .82);
            --border: rgba(200, 200, 200, .2);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body,
        html {
            height: 100%;
            font-family: 'Noto Serif JP', 'Georgia', serif;
            background: #000;
            overflow: hidden;
        }

        .work-background {
            position: fixed;
            inset: 0;
            background-image:url('../image/hazuretasharin.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            filter: brightness(0.5) grayscale(0.7);
            animation: bgS 15s ease-in-out infinite alternate;
        }

        @keyframes bgS {
            from {
                transform: scale(1.0);
            }

            to {
                transform: scale(1.02);
            }
        }

        .main-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 620px;
            height: 90vh;
            margin: 5vh auto;
            background: var(--overlay);
            border-left: 3px solid var(--border);
            border-right: 3px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 50px 40px 30px;
            animation: gFade 1.4s ease both;
        }

        @keyframes gFade {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .header-line {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
            flex-shrink: 0;
            opacity: 0;
            animation: gItem .8s .2s ease forwards;
        }

        .header-line::before,
        .header-line::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .header-label {
            font-size: .7rem;
            color: var(--grey);
            letter-spacing: 4px;
            white-space: nowrap;
        }

        @keyframes gItem {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .catch-copy {
            font-size: .88rem;
            font-style: italic;
            color: var(--grey);
            letter-spacing: 1px;
            margin-bottom: 10px;
            opacity: 0;
            animation: gItem .6s .5s ease forwards;
        }

        .work-title {
            font-size: 3.8rem;
            font-weight: 900;
            color: var(--white);
            line-height: 1.0;
            margin-bottom: 12px;
            letter-spacing: -2px;
            opacity: 0;
            animation: gItem .6s .7s ease forwards;
        }

        .meta-info {
            font-size: .78rem;
            color: var(--red-dim);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 28px;
            opacity: 0;
            animation: gItem .6s .9s ease forwards;
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin-bottom: 22px;
            flex-shrink: 0;
            opacity: 0;
            animation: gItem .5s 1s ease forwards;
        }

        .synopsis-box {
            flex-grow: 1;
            font-size: 1rem;
            line-height: 2.1;
            color: rgba(240, 240, 236, .85);
            overflow-y: auto;
            margin-bottom: 22px;
            padding-right: 8px;
            white-space: pre-wrap;
            opacity: 0;
            animation: gItem .8s 1.1s ease forwards;
        }

        .synopsis-box::-webkit-scrollbar {
            width: 2px;
        }

        .synopsis-box::-webkit-scrollbar-thumb {
            background: var(--border);
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            opacity: 0;
            animation: gItem .6s 1.3s ease forwards;
        }

        .action-btn {
            background: transparent;
            color: var(--white);
            text-decoration: none;
            text-align: center;
            padding: 11px 8px;
            font-family: 'Noto Serif JP', serif;
            font-size: .82rem;
            border: 1px solid rgba(255, 255, 255, .2);
            letter-spacing: 1px;
            transition: border-color .25s, color .25s;
        }

        .action-btn:hover {
            border-color: var(--white);
            background: rgba(255, 255, 255, .05);
        }

        .back-nav {
            position: fixed;
            bottom: 22px;
            right: 22px;
            z-index: 100;
            background: var(--dark);
            color: var(--grey);
            padding: 8px 16px;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, .15);
            font-family: 'Noto Serif JP', serif;
            font-size: .8rem;
            letter-spacing: 2px;
            transition: color .2s, border-color .2s;
        }

        .back-nav:hover {
            color: var(--white);
            border-color: rgba(255, 255, 255, .5);
        }

        @media(max-width:600px) {
            .main-container {
                padding: 30px 20px 20px;
                height: 95vh;
                margin: 2.5vh auto;
            }

            .work-title {
                font-size: 2.5rem;
            }

            .button-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
<link rel="stylesheet" href="../mouse-trail.css">
</head>

<body>
    <div class="work-background"></div>
    <div class="main-container">
        <div class="header-line"><span class="header-label">NON-FICTION / DOCUMENTARY</span></div>
        <p class="catch-copy">社会のレールから弾き飛ばされた、その後の歩み。</p>
        <h1 class="work-title">外れた車輪</h1>
        <p class="meta-info">NON-FICTION / Documentary Aftermath</p>
        <div class="divider"></div>
        <div class="synopsis-box">『死屍涙々』の後日譚。
最愛の瀬奈を失い、社会という巨大な機構のレールから弾き飛ばされた基徒 花十。

古本屋で出会った物部静との奇妙な交流。そして、母パトリシアを襲った過酷な受難（詐欺被害）。
次々と押し寄せる理不尽な現実を、彼は「当然の報い」として受け入れようと足掻く。

壊れた車輪のまま、どこへ向かうこともできず彷徨う魂の遍歴。</div>
        <div class="button-grid"><a href="#" class="action-btn">準備中</a><a href="#" class="action-btn">準備中</a></div>
    </div>
    <a href="../index.html" class="back-nav">&#8592; 一覧へ戻る</a>
<script src="../mouse-trail.js"></script>
</body>

</html>
