<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetaBites!! - Stadio Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Share+Tech+Mono&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --accent: #f97316;
            --accent-dim: #78350f;
            --overlay: rgba(8, 4, 0, 0.78);
            --text: #f5d6d6;
            --text-dim: #9e6b6b;
            --border: rgba(249, 115, 22, 0.35);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body,
        html {
            height: 100%;
            font-family: 'Noto Serif JP', 'Georgia', serif;
            background: #000;
            overflow: hidden;
        }

        .work-background {
            position: fixed;
            inset: 0;
            background-image: url('../image/petabites.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            filter: brightness(0.7) saturate(0.6);
            animation: bgBreath 8s ease-in-out infinite;
        }

        @keyframes bgBreath {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.03);
            }
        }

        .scanlines {
            position: fixed;
            inset: 0;
            z-index: 2;
            background: repeating-linear-gradient(to bottom, transparent 0px, transparent 3px, rgba(0, 0, 0, 0.08) 3px, rgba(0, 0, 0, 0.08) 4px);
            pointer-events: none;
        }

        .main-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 640px;
            height: 90vh;
            margin: 5vh auto;
            background: var(--overlay);
            border: 1px solid var(--border);
            box-shadow: 0 0 40px rgba(249, 115, 22, 0.12);
            display: flex;
            flex-direction: column;
            padding: 36px 40px 30px;
            animation: cFade .9s cubic-bezier(.22, 1, .36, 1) both;
        }

        @keyframes cFade {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .main-container::before {
            content: '';
            display: block;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            margin-bottom: 20px;
            flex-shrink: 0;
            animation: lineGlow 3s ease-in-out infinite;
        }

        @keyframes lineGlow {

            0%,
            100% {
                opacity: .5;
            }

            50% {
                opacity: 1;
            }
        }

        .catch-copy {
            font-family: 'Share Tech Mono', monospace;
            font-size: .85rem;
            color: var(--accent);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
            opacity: 0;
            animation: tIn .6s .3s ease forwards;
        }

        .work-title {
            font-family: 'Share Tech Mono', monospace;
            font-size: 3.4rem;
            font-weight: 900;
            color: #fff;
            line-height: 1.0;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(249, 115, 22, .4);
            opacity: 0;
            animation: tIn .6s .45s ease forwards;
        }

        .meta-info {
            font-family: 'Share Tech Mono', monospace;
            font-size: .82rem;
            color: var(--text-dim);
            letter-spacing: 3px;
            border-left: 2px solid var(--accent-dim);
            padding-left: 10px;
            margin-bottom: 22px;
            opacity: 0;
            animation: tIn .6s .6s ease forwards;
        }

        .synopsis-box {
            flex-grow: 1;
            font-size: 1rem;
            line-height: 1.85;
            color: var(--text);
            overflow-y: auto;
            margin-bottom: 22px;
            padding-right: 8px;
            white-space: pre-wrap;
            border-left: 1px solid var(--border);
            padding-left: 16px;
            opacity: 0;
            animation: tIn .7s .75s ease forwards;
        }

        .synopsis-box::-webkit-scrollbar {
            width: 4px;
        }

        .synopsis-box::-webkit-scrollbar-thumb {
            background: var(--accent-dim);
        }

        @keyframes tIn {
            from {
                opacity: 0;
                transform: translateX(-8px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            opacity: 0;
            animation: tIn .6s 1s ease forwards;
        }

        .action-btn {
            background: transparent;
            color: var(--accent);
            text-decoration: none;
            text-align: center;
            padding: 11px 10px;
            font-family: 'Share Tech Mono', monospace;
            font-size: .82rem;
            letter-spacing: 1px;
            border: 1px solid var(--accent);
            transition: background .2s, color .2s;
        }

        .action-btn.special-btn {
            border-color: var(--accent);
            color: #000;
            background: var(--accent);
            font-weight: bold;
        }

        .action-btn:hover {
            background: rgba(249, 115, 22, .15);
            color: #ffb17a;
        }

        .back-nav {
            position: fixed;
            bottom: 22px;
            right: 22px;
            z-index: 100;
            background: #000;
            color: var(--accent);
            padding: 8px 16px;
            text-decoration: none;
            border: 1px solid var(--accent);
            font-family: 'Share Tech Mono', monospace;
            font-size: .78rem;
            letter-spacing: 2px;
            transition: background .2s, color .2s;
        }

        .back-nav:hover {
            background: var(--accent);
            color: #000;
        }

        @media(max-width:600px) {
            .main-container {
                padding: 24px 20px 20px;
                height: 95vh;
                margin: 2.5vh auto;
            }

            .work-title {
                font-size: 2.2rem;
            }

            .button-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="work-background"></div>
    <div class="scanlines"></div>
    <div class="main-container">
        <p class="catch-copy">内燃機関の灯す赤い光は、電気よりも安堵を与える。</p>
        <h1 class="work-title">PetaBites!!</h1>
        <p class="meta-info">NOVEL / Coming Soon</p>
        <div class="synopsis-box">
            1970年、通信技術なきデータ社会。巨大な機械を引きずり、内燃式の演算装置で記憶を運ぶ時代。記憶が通貨となり、燃料となる歪んだ世界の狭間で、中年の技師・九堂勇作は記憶の修復に挑む。

            「記憶とは、残すものか、燃やすものか」。火花と油の匂い、そして信念が、冷たいデータの世界を赤く染め上げる。</div>
        <div class="button-grid">
            <a href="petabites-special.html" class="action-btn special-btn">コンセプトページ(特別版)</a>
            <a href="#" class="action-btn">準備中</a>
            <a href="#" class="action-btn">準備中</a>
            <a href="#" class="action-btn">準備中</a>
        </div>
    </div>
    <a href="../index.html" class="back-nav">&#8592; RETURN</a>
</body>

</html>
