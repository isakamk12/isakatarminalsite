<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>継承物語 - Stadio Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Cinzel:wght@400;700;900&display=swap"
        rel="stylesheet">
    <style>
        /* ===== THEME: EPIC-GOLD ===== */
        /* 継承物語 / 歴史 / 叙事詩 → 深紺×金、古典的書物 */
        :root {
            --gold: #d4a84b;
            --gold-light: #f0cc78;
            --gold-dim: rgba(212, 168, 75, 0.3);
            --navy: #08101e;
            --overlay: rgba(6, 12, 26, 0.80);
            --text: #ede8d8;
            --border: rgba(212, 168, 75, 0.4);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body,
        html {
            height: 100%;
            font-family: 'Noto Serif JP', 'Georgia', serif;
            background: var(--navy);
            overflow: hidden;
        }

        /* === 背景（表紙）=== */
        .work-background {
            position: fixed;
            inset: 0;
            background: url('../image/poeticwaltz.png') no-repeat center center / cover;
            z-index: 1;
            filter: brightness(0.65) sepia(0.3);
            animation: majesticPan 20s ease-in-out infinite alternate;
        }

        @keyframes majesticPan {
            from {
                transform: scale(1.05) translateX(10px);
            }

            to {
                transform: scale(1.0) translateX(-10px);
            }
        }

        /* 金属光沢グラデ―ション（上下） */
        .vignette {
            position: fixed;
            inset: 0;
            z-index: 2;
            background:
                radial-gradient(ellipse at top, rgba(212, 168, 75, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at bottom, rgba(0, 0, 0, 0.6) 0%, transparent 60%);
            pointer-events: none;
        }

        /* === メインコンテナ === */
        .main-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 640px;
            height: 90vh;
            margin: 5vh auto;
            background: var(--overlay);
            /* 王冠モチーフのダブルボーダー */
            border: 1px solid var(--border);
            box-shadow:
                inset 0 0 0 4px rgba(212, 168, 75, 0.06),
                0 0 60px rgba(0, 0, 0, 0.6),
                0 0 120px rgba(212, 168, 75, 0.04);
            display: flex;
            flex-direction: column;
            padding: 36px 44px 28px;
            animation: epicOpen 1.2s cubic-bezier(0.2, 1, 0.3, 1) both;
        }

        @keyframes epicOpen {
            from {
                opacity: 0;
                clip-path: inset(30% 0 30% 0);
            }

            to {
                opacity: 1;
                clip-path: inset(0% 0 0% 0);
            }
        }

        /* 金縁コーナー装飾 */
        .main-container::before,
        .main-container::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: var(--gold);
            border-style: solid;
            flex-shrink: 0;
        }

        .main-container::before {
            top: 10px;
            left: 10px;
            border-width: 2px 0 0 2px;
        }

        .main-container::after {
            bottom: 10px;
            right: 10px;
            border-width: 0 2px 2px 0;
        }

        /* タイトル上部の金の横線 */
        .gold-rule {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            flex-shrink: 0;
            opacity: 0;
            animation: goldRise 0.8s 0.2s ease forwards;
        }

        .gold-rule::before,
        .gold-rule::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .gold-rule-icon {
            color: var(--gold);
            font-size: 1rem;
        }

        @keyframes goldRise {
            from {
                opacity: 0;
                transform: scaleX(0);
            }

            to {
                opacity: 1;
                transform: scaleX(1);
            }
        }

        .catch-copy {
            font-size: 0.88rem;
            font-style: italic;
            color: var(--gold);
            letter-spacing: 2px;
            margin-bottom: 8px;
            opacity: 0;
            animation: epicText 0.7s 0.5s ease forwards;
        }

        .work-title {
            font-family: 'Cinzel', 'Noto Serif JP', serif;
            font-size: 3.0rem;
            font-weight: 900;
            color: var(--gold-light);
            line-height: 1.15;
            margin-bottom: 10px;
            text-shadow: 0 2px 20px rgba(212, 168, 75, 0.3);
            opacity: 0;
            animation: epicText 0.7s 0.7s ease forwards;
        }

        .meta-info {
            font-size: 0.8rem;
            color: rgba(212, 168, 75, 0.7);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 22px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--gold-dim);
            opacity: 0;
            animation: epicText 0.6s 0.9s ease forwards;
        }

        @keyframes epicText {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* あらすじ */
        .synopsis-box {
            flex-grow: 1;
            font-size: 1.0rem;
            line-height: 2.0;
            color: var(--text);
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 8px;
            white-space: pre-wrap;
            opacity: 0;
            animation: epicText 0.8s 1.1s ease forwards;
        }

        .synopsis-box::-webkit-scrollbar {
            width: 3px;
        }

        .synopsis-box::-webkit-scrollbar-thumb {
            background: var(--gold-dim);
        }

        /* 下部の金の横線 */
        .gold-rule-bottom {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
            margin-bottom: 16px;
            flex-shrink: 0;
            opacity: 0;
            animation: epicText 0.5s 1.2s ease forwards;
        }

        /* === ボタン群 === */
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            opacity: 0;
            animation: epicText 0.6s 1.3s ease forwards;
        }

        .action-btn {
            background: transparent;
            color: var(--gold);
            text-decoration: none;
            text-align: center;
            padding: 10px 8px;
            font-family: 'Noto Serif JP', serif;
            font-size: 0.82rem;
            border: 1px solid var(--border);
            letter-spacing: 1px;
            transition: background 0.3s, box-shadow 0.3s;
        }

        .action-btn:hover {
            background: rgba(212, 168, 75, 0.1);
            box-shadow: inset 0 0 10px rgba(212, 168, 75, 0.1);
            color: var(--gold-light);
        }

        /* 戻るボタン */
        .back-nav {
            position: fixed;
            bottom: 22px;
            right: 22px;
            z-index: 100;
            background: rgba(6, 12, 26, 0.95);
            color: var(--gold);
            padding: 8px 16px;
            text-decoration: none;
            border: 1px solid var(--border);
            font-family: 'Noto Serif JP', serif;
            font-size: 0.8rem;
            letter-spacing: 2px;
            transition: background 0.25s;
        }

        .back-nav:hover {
            background: rgba(212, 168, 75, 0.1);
        }

        @media (max-width: 600px) {
            .main-container {
                padding: 28px 20px 20px;
                height: 95vh;
                margin: 2.5vh auto;
            }

            .work-title {
                font-size: 2.2rem;
            }

            .button-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
<link rel="stylesheet" href="../mouse-trail.css">
</head>

<body>

    <div class="work-background"></div>
    <div class="vignette"></div>

    <div class="main-container">
        <div class="gold-rule">
            <span class="gold-rule-icon">✦</span>
        </div>

        <p class="catch-copy">継承とは、過去からの命令である。</p>

        <h1 class="work-title">継承物語</h1>

        <p class="meta-info">Saga Novel &ensp;/&ensp; Poetic Waltz</p>

        <div class="synopsis-box">王国の秩序が崩れる時代。
            かつて偉大な者たちが積み上げた「何か」を、次の世代へ渡さなければならない──。

            それが言葉であれ、剣であれ、魂であれ。
            受け取った者の重さを描く、四つの継承の物語。</div>

        <div class="gold-rule-bottom"></div>

        <div class="button-grid">
            <a href="#" class="action-btn">準備中</a>
            <a href="#" class="action-btn">準備中</a>
            <a href="#" class="action-btn">準備中</a>
            <a href="#" class="action-btn">準備中</a>
        </div>
    </div>

    <a href="../index.html" class="back-nav">← 一覧へ戻る</a>

<script src="../mouse-trail.js"></script>
</body>

</html>
